<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字程序员</title>
<style>
:root{
  --sidebar:#0f172a; --sidebar-soft:#162033; --main:#f8fafc; --ink:#0f172a;
  --muted:#64748b; --line:#e2e8f0; --blue:#2563eb; --blue-soft:#dbeafe;
  --card:#ffffff; --green:#10b981;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--main);color:var(--ink);font:14px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;overflow:hidden}
.sidebar{width:260px;min-width:260px;background:var(--sidebar);color:#e2e8f0;display:flex;flex-direction:column;padding:26px 18px 18px}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-row svg{width:36px;height:36px;flex:none}
.brand .name{font-size:22px;font-weight:700;letter-spacing:.5px;color:#fff}
.brand .sub{margin-top:6px;color:#94a3b8;font-size:12px;letter-spacing:.8px}
.side-label{margin:34px 8px 10px;color:#64748b;font-size:11px;font-weight:700;letter-spacing:.12em}
.workflow{display:flex;flex-direction:column;gap:4px}
.workflow button{width:100%;padding:11px 12px;border:0;border-radius:8px;background:transparent;color:#cbd5e1;text-align:left;font-size:14px}
.workflow button:hover{background:#1e293b;color:#fff}
.workflow button.active{background:#1d4ed8;color:#fff;font-weight:600}
.last-project{margin:6px 8px;padding:10px 11px;border:1px solid #243047;border-radius:8px;color:#94a3b8;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.last-project:hover{border-color:#3b82f6;color:#bfdbfe}
.side-footer{margin-top:auto;padding:10px 8px 0;border-top:1px solid #243047;color:#64748b;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--main)}
.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);color:#64748b;background:#fff}
.topbar b{color:#334155;font-weight:600}
.hub-link{border:0;background:transparent;color:#2563eb;font-size:13px;font-weight:600;padding:4px 6px;border-radius:6px}
.hub-link:hover{background:#eff6ff;text-decoration:underline}
.top-actions{display:flex;align-items:center;gap:4px}
.content{flex:1;overflow:auto;padding:28px 34px 24px;max-width:1040px;width:100%;margin:0 auto}
h1{margin:16px 0 6px;font-size:30px;line-height:1.2;letter-spacing:-.02em}
.sub{margin:0 0 24px;color:var(--muted)}
.prompt-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
.prompt-card label{display:block;margin-bottom:9px;color:#334155;font-weight:600;font-size:13px}
.path-row{display:flex;gap:10px}
.path-row input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:9px;padding:11px 12px;background:#fff;color:#0f172a;outline:none}
.path-row input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}
.path-row button,.ghost{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:9px;padding:11px 16px}
.path-row button:hover,.ghost:hover{border-color:#94a3b8;background:#f8fafc}
.action-row{display:flex;gap:10px;margin-top:14px}
.primary{flex:1;border:0;border-radius:9px;padding:13px 18px;background:var(--blue);color:#fff;font-size:15px;font-weight:700}
.primary:hover{background:#1d4ed8}
.ghost{padding:13px 18px}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.9fr);gap:16px;margin-top:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 28px rgba(15,23,42,.04)}
.card h2{font-size:15px;margin:0 0 10px;color:#334155}
.hint{min-height:76px;margin:0;color:#475569;white-space:pre-line}
.link{margin-top:10px;border:0;background:transparent;color:var(--blue);padding:0;font-size:13px}
.link:hover{text-decoration:underline}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:5px;color:#64748b;font-size:12px}
.field select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 9px;background:#fff;color:#0f172a}
.plugin-card{margin-top:16px}
.plugin-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.plugin-head h2{margin:0}
.plugin-head span{color:#94a3b8;font-size:12px}
.plugin-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plugin-item{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;color:#334155;cursor:pointer}
.plugin-item:hover{border-color:#bfdbfe;background:#f0f7ff}
.plugin-item input{margin-top:2px}
.plugin-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.plugin-copy b{font-size:13px}
.plugin-copy small{color:#64748b;font-size:11px;line-height:1.35}
.resume{display:flex;align-items:center;gap:8px;color:#475569;font-size:13px}
#resumeHint{display:block;margin-top:8px;color:#94a3b8;font-size:12px;min-height:18px}
.footer{display:flex;justify-content:space-between;gap:12px;margin-top:18px;color:#94a3b8;font-size:12px}
.notice{margin-bottom:14px;padding:10px 12px;border-radius:8px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12px;display:none}
.notice.show{display:block}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal-card{width:min(680px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 24px 80px rgba(15,23,42,.25)}
.modal-card h2{margin:0 0 10px;font-size:18px}
.modal-card pre{white-space:pre-wrap;color:#334155;font:13px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;margin:0}
.modal-close{float:right;border:0;background:#f1f5f9;border-radius:8px;padding:6px 11px;color:#334155}
@media(max-width:1000px){.plugin-list{grid-template-columns:1fr}}
@media(max-width:900px){.grid{grid-template-columns:1fr}.sidebar{width:220px;min-width:220px}.content{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <rect x="8" y="8" width="184" height="184" rx="40" fill="#0B1220"/>
          <path d="M 146 62 C 146 48 130 40 108 40 C 82 40 60 52 60 74 C 60 94 78 102 104 105 C 126 108 144 116 144 136 C 144 158 124 164 100 164 C 76 164 58 156 58 142"
                fill="none" stroke="#F8FAFC" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="104" cy="104" r="22" fill="#0B1220"/>
          <circle cx="104" cy="104" r="12" fill="#22D3EE"/>
        </svg>
        <div><div class="name">数字程序员</div><div class="sub">Digital Programmer</div></div>
      </div>
    </div>
    <div class="side-label">工作流</div>
    <div class="workflow" id="workflows"></div>
    <div class="side-label">最近项目</div>
    <div class="last-project" id="lastProject">暂无</div>
    <div class="side-footer">本地模型 · 工作流与插件</div>
  </aside>
  <main class="main">
    <div class="topbar"><span></span><span class="top-actions"><button class="hub-link" id="scheduler">定时任务</button><button class="hub-link" id="hub">灵枢SmartHub</button></span></div>
    <div class="content">
      <div class="notice" id="notice"></div>
      <h1>需要帮你做什么？</h1>
      <p class="sub">选择项目目录与工作流，然后打开 Digital Programmer</p>
      <div class="prompt-card">
        <label for="dir">项目目录</label>
        <div class="path-row"><input id="dir" placeholder="选择项目目录" autocomplete="off"><button id="browse">浏览</button></div>
        <div class="action-row"><button class="primary" id="launch">打开 Digital Programmer</button><button class="ghost" id="cancel">取消</button></div>
        <div class="footer"><span id="status">会话管理默认启用 · 数据保存在本机</span></div>
      </div>
      <div class="grid">
        <section class="card"><h2>工作流说明</h2><p class="hint" id="hint"></p><button class="link" id="help">查看使用说明 ›</button></section>
        <section class="card">
          <h2>启动设置</h2>
          <div class="field"><label for="terminal">终端类型</label><select id="terminal"><option value="native">原生</option><option value="dedicated">专用 (Windows Terminal / CMD)</option></select></div>
          <label class="resume"><input type="checkbox" id="resume"> 继续上次会话</label>
          <span id="resumeHint"></span>
        </section>
      </div>
      <section class="card plugin-card">
        <div class="plugin-head"><h2>插件</h2><span>对本机所有项目生效</span></div>
        <div class="plugin-list" id="plugins"></div>
      </section>
    </div>
  </main>
</div>
<div class="modal" id="modal"><div class="modal-card"><button class="modal-close" id="closeHelp">关闭</button><h2 id="helpTitle">使用说明</h2><pre id="helpBody"></pre></div></div>
<script>
const WORKFLOWS = {
  task: {
    label: "一般任务",
    hint: "适合文档、排查、整理、代码审核等轻量任务。\n新会话自动发送「启动一般任务」；继续上次会话直接恢复。完成后说「本次任务已完成」。\n代码审核也选这里：启动后说明审核范围；AI 只读审查。",
    help: "一般任务\n\n适合：写文档、排查问题、整理资料、配置环境、代码审核等轻量工作。\n没有多阶段确认，只统计预估工时和实际用时。\n\n第 1 步：启动\n· 新会话会自动发送「启动一般任务」。\n· 勾选「继续上次会话」时不发送启动短语，直接恢复上次进度。\n\n第 2 步：说明任务\n输入示例：\n「帮我整理这份接口文档」\n「排查登录接口 500 错误」\n「审核 src/auth.ts 的登录改动」\nAI 会先归类任务类型，普通任务只影响统计。\n\n第 3 步：回答预估工时\nAI 问预估时，输入：\n「预估 2 小时」\n请用「预估 + 数字 + 小时」的格式，只说「半天」可能无法录入。\n\n第 4 步：完成任务\n普通任务做完后输入：\n「本次任务已完成」\n只说「完成」时，AI 会再问一次「本次任务是否已完成？」；点明任务再确认。\n\n代码审核任务：\n· 启动后说明审核范围，例如「审核这次 diff」「审核 src/auth.ts 的登录改动」。\n· AI 只读：不改代码、不提交、不跑 build/test/lint。\n· AI 提交审核报告后任务才完成；结论为 changes_requested 时不会自动改代码。\n· 如果 AI 停下来等你确认，输入「按这个结论提交审核报告」。\n\n开始下一个任务：\n输入 /new，避免同一个会话混入多个任务、污染工时统计。"
  },
  sdlc: {
    label: "SDLC 开发流程",
    hint: "适合完整开发：需求 → 设计 → 编码 → 测试 → 审查。\n新会话自动发送「启动 SDLC 工作流」；继续上次会话直接恢复。每阶段需你确认。\n会问预估工时；点「查看使用说明」看详细步骤。",
    help: "SDLC 开发流程\n\n适合：从需求到设计、编码、测试、审查的完整开发。\n每一步都要你明确确认，AI 不会自行确认。\n\n第 1 步：启动\n· 新会话自动发送「启动 SDLC 工作流」。\n· 勾选「继续上次会话」时不发送，直接恢复上次进度。\n\n第 2 步：需求分析\n说明要做什么、边界和验收标准。输入示例：\n「做一个公告发布功能，支持附件和定时发布」\nAI 问预估工时时，输入：\n「预估 8 小时」\n\n第 3 步：确认需求，进入设计\n看完需求摘要后输入：\n「需求确认，进入设计」\n还要改时直接说「需求还要改：……」，不要确认。\n\n第 4 步：确认设计，开始编码\n输入：\n「设计确认，开始编码」\n\n第 5 步：编码完成，进入测试\n输入：\n「编码完成，进入测试」\nAI 会先请你确认编码结果；未确认不会前进。\n\n第 6 步：测试通过，进入审查\n输入：\n「测试通过，进入审查」\n测试失败时输入「测试没通过，继续修」，并说明失败项。\n\n第 7 步：审查代码\nAI 会把代码拆成片段解释。每看懂一个片段，输入：\n「这个片段我理解了，确认」\n全部片段确认、审查清单通过后，输入：\n「审查通过，提交」\nAI 提交审查结果后才能执行 git commit。\n\n第 8 步：提交与结束\n提交成功后输入 /new 开始下一个需求。\n\n常用操作：\n· 回退阶段：「回到设计」「回到编码」\n· 需求变更：「需求改了，回到需求分析」\n· 手工改文件：AI 锁定文件后你编辑，改完输入「改完了，可以继续」\n· 只想暂停：「暂停，先记录当前进度」"
  },
  reqdoc: {
    label: "REQDOC 需求书",
    hint: "适合业务写需求书：口述或投放材料，AI 追问补全后生成 PRD。\n新会话自动发送「启动 REQDOC 工作流」；继续上次会话直接恢复。定稿前逐条确认要点。\n目标阶段会问预估工时；点「查看使用说明」看详细步骤。",
    help: "REQDOC 需求书\n\n适合：业务口述或投放材料，AI 追问补全后生成 PRD。\n每一步都要业务明确确认。\n\n第 1 步：启动\n· 新会话自动发送「启动 REQDOC 工作流」。\n· 勾选「继续上次会话」时不发送，直接恢复上次进度。\n\n第 2 步：选择补料方式\nAI 会建好 00~07 资料目录并问「投放材料，还是直接口述？」\n输入示例：\n「直接口述」\n或\n「我把材料放到 01 和 03 了，开始扫描」\n目录：00 初稿、01 背景目标、02 流程数据、03 制度合规、04 角色权限、05 系统现状。\n\n第 3 步：目标与场景\n回答谁在用、解决什么痛点、业务价值。\nAI 问预估工时时，输入：\n「预估 8 小时」\n确认输入：\n「目标与场景确认，进入流程与规则」\n\n第 4 步：流程与规则\n回答主流程、字段、状态和数据规则。\n确认输入：\n「流程与规则确认，进入边界与异常」\n\n第 5 步：边界与异常\n回答异常、撤销、权限和合规场景；尽量给真实案例。\n确认输入：\n「边界与异常确认，进入需求规格书」\n\n第 6 步：需求规格书\n先确认功能点清单，并说明哪些必须优先：\n「功能点清单确认，公告发布为高优先级」\nPRD 由系统生成，不要手工编辑。\n确认输入：\n「需求规格书确认，进入业务确认」\n\n第 7 步：业务确认与定稿\nAI 会逐条列出 PRD 要点。每确认一条输入：\n「这个要点我确认」\n全部确认后输入：\n「业务确认完成，定稿」\n\n第 8 步：导出与结束\n定稿后输入 /new 开始下一个需求。\n需要 Word 交付件时输入：\n「导出 Word」\n\n定稿后要改某一章：\n· 先输入「回到需求规格书」让流程回退。\n· 再说「修改第 2 章：……」，AI 会锁定该章并引导你补充事实。\n· 改完先重组装，再导出差异或整章。\n不要直接让 AI 改 PRD 成品文件。"
  },
  websec: {
    label: "WEB 安全自测",
    hint: "适合开发人员对自己负责的系统做上线前安全自测。\n新会话自动发送「启动 WEB 安全测试工作流」；拉起 Edge 后先选普通测试或越权测试。\n范围阶段会问预估工时；未录入不能定稿。默认只读，证据正文保存在项目 websec-evidence/。",
    help: "WEB 安全自测\n\n适合：开发人员对自己负责的系统做上线前安全自测，不替代专业渗透测试。\n系统内部固定五阶段：范围与边界 → 资产与接口 → 安全检查 → 验证与定级 → 报告与修复。你主要完成范围、登录走查和报告确认。\n\n第 1 步：启动\n· 新会话自动发送「启动 WEB 安全测试工作流」。\n· 勾选「继续上次会话」时不发送，直接恢复上次进度。\n\n第 2 步：说明测试范围\n一次说清目标、环境、测试账号和停止条件。输入示例：\n「目标 http://127.0.0.1:18086，测试环境，测试账号 user，角色普通用户，发现异常就停」\n不要把口令发到对话里，登录 Edge 时再输入。\nAI 问预估工时时，输入：\n「预估 8 小时」\n\n第 3 步：选择测试模式\n输入：\n「普通测试」\n或\n「越权测试」\n普通测试需要 1 个账号；越权测试需要至少 2 个不同角色账号（普通 + 高权）。\n\n第 4 步：在 Edge 中走查\nAI 打开 Edge 后，你登录并正常走完页面和操作流程。\n完成后输入：\n「本次录入已完成」\n\n越权测试：\n· 先用普通账号走完流程，输入「本次录入已完成」。\n· AI 会提示当前是普通账号还是高权账号，并自动清除登录态，然后用高权账号重新登录并走同样流程。\n· 没有自动切换时，输入「切换到高权账号阶段」。\n· 高权账号走完后再输入「本次录入已完成」。\n\n第 5 步：匿名只读探测\nAI 询问是否授权匿名探测时，输入：\n「同意匿名探测」\n或\n「不同意匿名探测」\n只对已采集的同源 GET/HEAD 端点发无 Cookie 请求，不发写操作。\n\n第 6 步：检查与验证\nAI 分析已采集的页面和接口；需要复现时会问你。\n需要写操作时必须逐次授权，例如：\n「允许对 /api/settings 做一次写入验证」\n不做写操作时输入：\n「不做写操作，按只读结论报告」\n\n第 7 步：确认报告\nAI 生成报告后输入：\n「报告确认，定稿」\n报告路径会显示在回执里，证据正文保存在项目 websec-evidence/<sessionID>/，目录内 .gitignore 忽略正文。\n\n第 8 步：结束与复测\n定稿后输入 /new 开始下一次测试；修复后复测也建议新会话。\nEdge 启动失败时，AI 会请求降级，你确认后输入：\n「同意降级为人工浏览」\n未录入预估工时时不能定稿。\n\n提示：WEB 安全自测使用「会话管理」内置的 Edge 桥接，不需要额外启用「Edge 调试」插件。"
  }
};
const PLUGINS = {
  sm: { label: "会话管理", desc: "默认启用；关闭后工作流、工时与审核报告不可用" },
  edge: { label: "Edge 调试", desc: "启用独立 Edge 调试插件；WEB 安全自测不需要勾选（使用会话管理内置桥接）" },
  server: { label: "服务器调试", desc: "启用服务器调试插件" }
};
const state = { workflow: "sdlc", terminal: "native", plugins: ["sm"], configOk: true, identityOk: true, lastProject: "", dir: "", resume: false };
let canResume = false;

const $ = (id) => document.getElementById(id);
const post = (type, payload = {}) => window.chrome.webview.postMessage({ type, payload });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function applyWorkflowDefaults() {
  // WEB 安全自测使用会话管理内置的 Edge 桥接，自动关闭独立 Edge 调试插件。
  if (state.workflow === "websec") {
    state.plugins = state.plugins.filter(key => key !== "edge");
  }
}
function renderWorkflows() {
  $("workflows").innerHTML = Object.entries(WORKFLOWS).map(([key, item]) =>
    `<button data-workflow="${key}" class="${state.workflow === key ? "active" : ""}">${esc(item.label)}</button>`
  ).join("");
  document.querySelectorAll("[data-workflow]").forEach(button => {
    button.addEventListener("click", () => {
      state.workflow = button.dataset.workflow;
      applyWorkflowDefaults();
      renderWorkflows(); renderPlugins(); renderHint(); checkResume();
    });
  });
}
function renderHint() {
  $("hint").textContent = WORKFLOWS[state.workflow]?.hint ?? "";
}
function renderPlugins() {
  $("plugins").innerHTML = Object.entries(PLUGINS).map(([key, item]) =>
    `<label class="plugin-item"><input type="checkbox" data-plugin="${key}" ${state.plugins.includes(key) ? "checked" : ""} ${state.configOk ? "" : "disabled"}><span class="plugin-copy"><b>${esc(item.label)}</b><small>${esc(item.desc)}</small></span></label>`
  ).join("");
  document.querySelectorAll("[data-plugin]").forEach(input => {
    input.addEventListener("change", () => {
      state.plugins = [...document.querySelectorAll("[data-plugin]")].filter(x => x.checked).map(x => x.dataset.plugin);
    });
  });
}
function renderState() {
  applyWorkflowDefaults();
  $("dir").value = state.dir || state.lastProject || "";
  $("terminal").value = state.terminal;
  $("resume").checked = false;
  $("lastProject").textContent = state.lastProject || "暂无";
  $("lastProject").title = state.lastProject || "";
  const notices = [];
  const componentProblems = {
    "launcher-config-missing": "启动器组件 launcher-config.js 缺失，请重新运行安装包修复。",
    "runtime-missing": "运行环境 node.exe 缺失，请重新运行安装包修复。",
    "config-read-failed": "配置读取失败，请检查 opencode.jsonc 或重新运行安装包。",
    "config-invalid": "配置文件缺失或无法解析，请检查 opencode.jsonc 或重新运行安装包。"
  };
  if (state.configProblem) {
    notices.push(componentProblems[state.configProblem] || "启动器配置读取失败，请重新运行安装包。");
  } else if (!state.configOk) {
    notices.push("配置文件缺失或无法解析，插件开关不可用；请检查 opencode.jsonc 或重新运行安装包。");
  } else if (!state.identityOk) {
    notices.push("身份文件缺失，工作流暂不可用；请先运行 opencode-sm init。");
  }
  if (notices.length > 0) {
    $("notice").textContent = notices.join(" ");
    $("notice").classList.add("show");
  } else {
    $("notice").classList.remove("show");
  }
  renderWorkflows(); renderPlugins(); renderHint();
  checkResume();
}
function checkResume() {
  if (!state.dir) return;
  post("resume", { dir: state.dir, workflow: state.workflow });
}
function updateResume(result) {
  canResume = !!result?.can;
  $("resume").disabled = !canResume;
  if (!canResume) $("resume").checked = false;
  $("resumeHint").textContent = result?.hint || "";
}
function showError(message) {
  $("notice").textContent = message;
  $("notice").classList.add("show");
}
function clearError() {
  $("notice").textContent = "";
  $("notice").classList.remove("show");
}
$("scheduler").addEventListener("click", () => post("openScheduler"));
$("hub").addEventListener("click", () => post("openHub"));
$("lastProject").addEventListener("click", () => {
  if (!state.lastProject) return;
  state.dir = state.lastProject;
  $("dir").value = state.lastProject;
  checkResume();
});
$("browse").addEventListener("click", () => post("browse", { dir: state.dir }));
$("dir").addEventListener("input", () => { state.dir = $("dir").value.trim(); checkResume(); });
$("terminal").addEventListener("change", () => { state.terminal = $("terminal").value; });
$("resume").addEventListener("change", () => { state.resume = $("resume").checked; });
$("launch").addEventListener("click", () => {
  clearError();
  state.dir = $("dir").value.trim();
  if (!state.dir) { showError("请先选择项目目录"); return; }
  $("launch").disabled = true;
  post("launch", { dir: state.dir, workflow: state.workflow, terminal: state.terminal, plugins: state.plugins, resume: $("resume").checked });
});
$("cancel").addEventListener("click", () => post("cancel"));
$("help").addEventListener("click", () => {
  $("helpTitle").textContent = WORKFLOWS[state.workflow]?.label + " · 使用说明";
  $("helpBody").textContent = WORKFLOWS[state.workflow]?.help ?? "";
  $("modal").classList.add("open");
});
$("closeHelp").addEventListener("click", () => $("modal").classList.remove("open"));
$("modal").addEventListener("click", (event) => { if (event.target === $("modal")) $("modal").classList.remove("open"); });

window.chrome.webview.addEventListener("message", (event) => {
  const message = event.data || {};
  const payload = message.payload;
  switch (message.type) {
    case "state":
      Object.assign(state, payload || {});
      if (!Array.isArray(state.plugins)) {
        state.plugins = ["sm", "edge", "server"].filter(key => state[key] === true);
      }
      renderState();
      break;
    case "browse":
      if (payload) { state.dir = payload; $("dir").value = payload; checkResume(); }
      break;
    case "resume":
      updateResume(payload);
      break;
    case "launch":
      if (payload?.ok) { $("status").textContent = "正在打开 Digital Programmer…"; }
      else { $("launch").disabled = false; showError(payload?.error || "启动失败"); }
      break;
    case "error":
      $("launch").disabled = false;
      showError(String(payload || "启动器发生错误"));
      break;
  }
});
post("init");
</script>
</body>
</html>
